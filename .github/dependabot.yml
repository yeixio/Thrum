version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directory: /collector
    schedule:
      interval: monthly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: monthly
    groups:
      rust-dependencies:
        patterns: ["*"]
