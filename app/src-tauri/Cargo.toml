[package]
name = "thrum"
version = "0.1.0"
description = "Hear the health of your Kubernetes cluster"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "thrum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
